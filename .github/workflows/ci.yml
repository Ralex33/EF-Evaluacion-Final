# GitHub Actions CI Workflow for Node.js Express Application
# This workflow triggers on push and pull_request events
# It installs dependencies, runs tests, and reports success/failure

name: Node.js CI

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run tests
      - name: Run tests
        run: |
          if [ -f package.json ] && grep -q "test" package.json; then
            npm test
          else
            echo "No tests found. Skipping..."
          fi